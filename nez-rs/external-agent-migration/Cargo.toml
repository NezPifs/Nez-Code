[package]
name = "nez-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "nez_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
nez-analytics = { workspace = true }
nez-config = { workspace = true }
nez-core = { workspace = true }
nez-core-plugins = { workspace = true }
nez-hooks = { workspace = true }
nez-login = { workspace = true }
nez-memories-write = { workspace = true }
nez-otel = { workspace = true }
nez-plugin = { workspace = true }
nez-protocol = { workspace = true }
nez-rollout = { workspace = true }
nez-thread-store = { workspace = true }
nez-utils-output-truncation = { workspace = true }
linkify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
nez-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
