[package]
edition.workspace = true
license.workspace = true
name = "nez-goal-extension"
version.workspace = true

[lib]
name = "nez_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
nez-analytics = { workspace = true }
nez-core = { workspace = true }
nez-extension-api = { workspace = true }
nez-otel = { workspace = true }
nez-prompts = { workspace = true }
nez-protocol = { workspace = true }
nez-rollout = { workspace = true }
nez-state = { workspace = true }
nez-tools = { workspace = true }
nez-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
nez-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
