[package]
edition.workspace = true
license.workspace = true
name = "nez-memories-extension"
version.workspace = true

[lib]
name = "nez_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
nez-core = { workspace = true }
nez-extension-api = { workspace = true }
nez-features = { workspace = true }
nez-otel = { workspace = true }
nez-protocol = { workspace = true }
nez-tools = { workspace = true }
nez-utils-absolute-path = { workspace = true }
nez-utils-output-truncation = { workspace = true }
nez-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
