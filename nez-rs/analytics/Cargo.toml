[package]
edition.workspace = true
license.workspace = true
name = "nez-analytics"
version.workspace = true

[lib]
doctest = false
name = "nez_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
nez-http-client = { workspace = true }
nez-app-server-protocol = { workspace = true }
nez-git-utils = { workspace = true }
nez-login = { workspace = true }
nez-model-provider = { workspace = true }
nez-plugin = { workspace = true }
nez-protocol = { workspace = true }
nez-state = { workspace = true }
nez-utils-path-uri = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
nez-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
