[package]
edition.workspace = true
license.workspace = true
name = "nez-thread-store"
version.workspace = true

[lib]
name = "nez_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
nez-app-server-protocol = { workspace = true }
nez-extension-items = { workspace = true }
nez-git-utils = { workspace = true }
nez-install-context = { workspace = true }
nez-otel = { workspace = true }
nez-protocol = { workspace = true }
nez-rollout = { workspace = true }
nez-state = { workspace = true }
nez-utils-absolute-path = { workspace = true }
nez-utils-path = { workspace = true }
nez-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqlx-macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
nez-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
