nez-agent-extension = { workspace = true }
nez-arg0 = { workspace = true }
nez-aws-auth = { workspace = true }
nez-cloud-config = { workspace = true }
nez-code-mode = { workspace = true }
nez-config = { workspace = true }
nez-network-proxy = { workspace = true }
nez-connectors = { workspace = true }
nez-core = { workspace = true }
nez-core-plugins = { workspace = true }
nez-diagnostics = { workspace = true }
nez-home = { workspace = true }
nez-exec-server = { workspace = true }
nez-extension-api = { workspace = true }
nez-external-agent-migration = { workspace = true }
nez-features = { workspace = true }
nez-goal-extension = { workspace = true }
nez-guardian-v2 = { workspace = true }
nez-git-utils = { workspace = true }
nez-file-watcher = { workspace = true }
nez-hooks = { workspace = true }
nez-history-notes-extension = { workspace = true }
nez-http-client = { workspace = true }
nez-otel = { workspace = true }
nez-plugin = { workspace = true }
