[package]
name = "nez-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = { workspace = true }
url = { workspace = true }
nez-backend-openapi-models = { path = "../nez-backend-openapi-models" }
nez-api = { workspace = true }
nez-http-client = { workspace = true }
nez-login = { workspace = true }
nez-model-provider = { workspace = true }
nez-protocol = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }
