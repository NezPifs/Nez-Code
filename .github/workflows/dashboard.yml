name: Dashboard

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s dashboard -v
