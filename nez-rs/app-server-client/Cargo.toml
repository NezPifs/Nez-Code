[package]
name = "nez-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nez_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
nez-app-server = { workspace = true }
nez-app-server-protocol = { workspace = true }
nez-arg0 = { workspace = true }
nez-config = { workspace = true }
nez-core = { workspace = true }
nez-exec-server = { workspace = true }
nez-feedback = { workspace = true }
nez-protocol = { workspace = true }
nez-uds = { workspace = true }
nez-utils-absolute-path = { workspace = true }
nez-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
